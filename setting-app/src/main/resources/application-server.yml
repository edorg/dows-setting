server:
  undertow:
    buffer-size: 1024
    direct-buffers: true
    threads:
      io: 4
      worker: 32
  #  servlet:
  #    context-path: /${spring.application.name}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain


---
#开发环境
spring:
  config:
    activate:
      on-profile: dev
server:
  port: 18001

rade:
  cacheName: hrm
  encryptor:
    enable: true
    algorithm: AES
    secretKey: 3fb2uPksjNOnxZI3

